services:
  db-postgres:
    image: postgres:16-alpine
    container_name: mikro-lab-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: mikro_lab
    volumes:
      - db-postgres:/var/lib/postgresql/data

volumes:
  db-postgres:
